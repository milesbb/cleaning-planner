version: 0.2

# Lint, typecheck and tests already passed in the GitHub release checks before this
# commit reached production, so the pipeline only installs, bundles and packages.
phases:
  install:
    commands:
      - command -v n >/dev/null || npm install --global n
      - n "$(cat .nvmrc)"
      - hash -r
      - node --version
      - >-
        npm ci --prefer-offline --no-audit --no-fund
        --workspace=apps/api --workspace=packages/contracts --workspace=packages/schedule
        --include-workspace-root
  build:
    commands:
      - npm run build --workspace=apps/api
      - >-
        aws cloudformation package
        --template-file infrastructure/template.yml
        --s3-bucket "$ARTIFACT_BUCKET"
        --s3-prefix lambda
        --output-template-file packaged.yml

artifacts:
  files:
    - packaged.yml
    - apps/api/dist/health-check.mjs

cache:
  paths:
    - /root/.npm/**/*
    - /usr/local/n/versions/**/*
