name: Security scans

# Called by PR checks (each PR's own commits) and release checks (the whole release),
# so a finding fails the PR that adds it instead of piling up until the release.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep (static security analysis)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          semgrep scan --error --metrics=off
          --config p/default --config p/typescript --config p/react
          --config p/nodejs --config p/secrets
          --exclude package-lock.json

  # On a pull request, gitleaks-action scans only that PR's commits.
  secrets:
    name: Gitleaks (secrets in the pull request's commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
