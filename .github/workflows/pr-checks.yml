name: PR checks

# "PR checks passed" is the required status check in the development ruleset; renaming it blocks merges.
on:
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  core:
    uses: ./.github/workflows/core-checks.yml

  passed:
    name: PR checks passed
    runs-on: ubuntu-latest
    needs: [core]
    if: always()
    steps:
      - name: Fail unless every check succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
