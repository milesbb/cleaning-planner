name: PR checks

# Fast checks for every pull request into development.
# "PR checks passed" is the required status check in the development ruleset.
on:
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run format:check
      - run: npx turbo run lint typecheck

  unit:
    name: Unit tests & coverage gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx turbo run test

  template:
    name: CloudFormation lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install cfn-lint
      - run: cfn-lint infrastructure/template.yml

  passed:
    name: PR checks passed
    runs-on: ubuntu-latest
    needs: [quality, unit, template]
    if: always()
    steps:
      - name: Fail unless every check succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
