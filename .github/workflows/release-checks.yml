name: Release checks

# "Release checks passed" is the required status check in the production ruleset; renaming it blocks merges.
on:
  pull_request:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-branch:
    name: Source branch is development
    runs-on: ubuntu-latest
    steps:
      - name: Only development may be merged into production
        if: github.event_name == 'pull_request'
        run: |
          echo "Head branch: ${{ github.head_ref }}"
          [ "${{ github.head_ref }}" = "development" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]
      - name: Manual run (no pull request to check)
        if: github.event_name != 'pull_request'
        run: echo "::notice::Manual run on ${{ github.ref_name }}; source-branch rule only applies to pull requests."

  core:
    uses: ./.github/workflows/core-checks.yml

  build:
    name: Production builds & Lambda smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx turbo run build
      - run: npm run test:smoke

  e2e:
    name: E2E (desktop, Android, iPhone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
        working-directory: apps/web
      - run: npx turbo run build --filter=@cleaning-planner/web
      - run: npm run test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm audit --omit=dev --audit-level=high

  hygiene:
    name: Dead code & duplication (Knip, jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run knip
      - run: npm run dupes

  mutation:
    name: Mutation testing (schedule engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run test:mutation
      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: packages/schedule/reports/mutation/
          retention-days: 14

  lighthouse:
    name: Lighthouse (accessibility, best practices, SEO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx turbo run build --filter=@cleaning-planner/web
      - run: npm run test:lighthouse
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci/
          retention-days: 14

  semgrep:
    name: Semgrep (static security analysis)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - run: >-
          semgrep scan --error --metrics=off
          --config p/default --config p/typescript --config p/react
          --config p/nodejs --config p/secrets
          --exclude package-lock.json

  secrets:
    name: Gitleaks (secrets in history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflows:
    name: actionlint (workflow files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:latest -color

  passed:
    name: Release checks passed
    runs-on: ubuntu-latest
    needs:
      [
        source-branch,
        core,
        build,
        e2e,
        audit,
        hygiene,
        mutation,
        lighthouse,
        semgrep,
        secrets,
        workflows,
      ]
    if: always()
    steps:
      - name: Fail unless every check succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
