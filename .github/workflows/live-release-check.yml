name: Live release check

# After each release: waits for Vercel's production deployment, checks every page
# answers with its Content-Security-Policy, and waits for /v1/health to report the
# commit the backend pipeline should have deployed. A failure emails the owner.
on:
  push:
    branches: [production]

permissions:
  contents: read
  deployments: read

concurrency:
  group: live-release-check-${{ github.sha }}
  cancel-in-progress: false

jobs:
  live:
    name: Website and API are live
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check the live website and API
        working-directory: apps/web
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          PREVIOUS_RELEASE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-live-release.ts
